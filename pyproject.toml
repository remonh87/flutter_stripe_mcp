[project]
name = "flutter-stripe-mcp"
version = "0.1.0"
description = "MCP server that diagnoses Flutter + Stripe (flutter_stripe) Android and iOS setup issues"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rémon Helmond", email = "remonhelmond+dev@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.28.1",
    "httpx>=0.27",
]

[project.scripts]
flutter-stripe-mcp = "flutter_stripe_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
